name: CI

on:
  push:
    branches: [master]
  pull_request:

jobs:
  core:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: core
    steps:
      - uses: actions/checkout@v4
      - uses: dart-lang/setup-dart@v1
        with:
          sdk: 3.7.3
      - run: dart pub get
      - run: dart analyze
      - run: dart test

  server:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: server
    steps:
      - uses: actions/checkout@v4
      - uses: dart-lang/setup-dart@v1
        with:
          sdk: 3.7.3
      - run: dart pub get
      - run: dart analyze
      - run: dart test

  mcp:
    strategy:
      matrix:
        os: [ubuntu-latest, windows-2022]
    runs-on: ${{ matrix.os }}
    defaults:
      run:
        working-directory: mcp
    steps:
      - uses: actions/checkout@v4
      - uses: dart-lang/setup-dart@v1
        with:
          sdk: 3.7.3
      - run: dart pub get
      - run: dart analyze
      - run: dart test

  app:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: app
    steps:
      - uses: actions/checkout@v4
      - uses: subosito/flutter-action@v2
        with:
          flutter-version: 3.29.3
          channel: stable
      - run: flutter pub get
      - run: flutter analyze
      - run: flutter test

  platform-builds:
    strategy:
      matrix:
        include:
          - os: ubuntu-latest
            platform: linux
          - os: macos-latest
            platform: macos
    runs-on: ${{ matrix.os }}
    defaults:
      run:
        working-directory: app
    steps:
      - uses: actions/checkout@v4
      - uses: subosito/flutter-action@v2
        with:
          flutter-version: 3.29.3
          channel: stable
      - name: Install Linux build dependencies
        if: matrix.platform == 'linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y ninja-build libgtk-3-dev libayatana-appindicator3-dev libsecret-1-dev libssl-dev
        working-directory: .
      - run: flutter pub get
      - run: flutter config --enable-${{ matrix.platform }}-desktop
      - run: flutter build ${{ matrix.platform }} --release

  windows-tests:
    runs-on: windows-2022
    steps:
      - uses: actions/checkout@v4
      - uses: dart-lang/setup-dart@v1
        with:
          sdk: 3.7.3
      - run: dart pub get
        working-directory: core
      - run: dart analyze
        working-directory: core
      - run: dart test
        working-directory: core
      - run: dart pub get
        working-directory: server
      - run: dart analyze
        working-directory: server
      - run: dart test
        working-directory: server

  windows-installer:
    runs-on: windows-2022
    steps:
      - uses: actions/checkout@v4
      - uses: subosito/flutter-action@v2
        with:
          flutter-version: 3.29.3
          channel: stable
      - run: choco install openssl innosetup -y --no-progress
      - name: Download official VC++ Redistributable
        shell: pwsh
        run: Invoke-WebRequest 'https://aka.ms/vc14/vc_redist.x64.exe' -OutFile "$env:RUNNER_TEMP\vc_redist.x64.exe"
      - name: Verify M8 and build versioned installer
        shell: pwsh
        run: .\tool\verify.ps1 -M8 -SoakSeconds 5 -BuildInstaller -VcRedistSource "$env:RUNNER_TEMP\vc_redist.x64.exe"
      - uses: actions/upload-artifact@v4
        with:
          name: kangoos-windows-x64-installer
          path: |
            app/dist/KangoOS-*-windows-x64-setup.exe
            app/dist/KangoOS-*-windows-x64-setup.exe.sha256
          if-no-files-found: error

  docker:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - run: docker build -f server/Dockerfile -t kangoos-server:ci .
      - name: Smoke test container
        env:
          KANGOOS_API_TOKEN: 0123456789abcdef0123456789abcdef
        run: |
          docker run -d --name kangoos-server-ci -p 8080:8080 -e KANGOOS_API_TOKEN kangoos-server:ci
          for attempt in {1..20}; do
            if curl --fail --silent --show-error http://127.0.0.1:8080/health \
              && curl --fail --silent --show-error -H "Authorization: Bearer $KANGOOS_API_TOKEN" http://127.0.0.1:8080/snippets; then
              exit 0
            fi
            sleep 1
          done
          docker logs kangoos-server-ci
          exit 1
