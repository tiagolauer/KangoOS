name: CI

on:
  push:
    branches: [master]
  pull_request:

jobs:
  core:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: core
    steps:
      - uses: actions/checkout@v4
      - uses: dart-lang/setup-dart@v1
        with:
          sdk: 3.7.3
      - run: dart pub get
      - run: dart analyze
      - run: dart test

  server:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: server
    steps:
      - uses: actions/checkout@v4
      - uses: dart-lang/setup-dart@v1
        with:
          sdk: 3.7.3
      - run: dart pub get
      - run: dart analyze
      - run: dart test

  mcp:
    strategy:
      matrix:
        os: [ubuntu-latest, windows-2022]
    runs-on: ${{ matrix.os }}
    defaults:
      run:
        working-directory: mcp
    steps:
      - uses: actions/checkout@v4
      - uses: dart-lang/setup-dart@v1
        with:
          sdk: 3.7.3
      - run: dart pub get
      - run: dart analyze
      - run: dart test

  app:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: app
    steps:
      - uses: actions/checkout@v4
      - uses: subosito/flutter-action@v2
        with:
          flutter-version: 3.29.3
          channel: stable
      - run: flutter pub get
      - run: flutter analyze
      - run: flutter test

  windows-tests:
    runs-on: windows-2022
    steps:
      - uses: actions/checkout@v4
      - uses: dart-lang/setup-dart@v1
        with:
          sdk: 3.7.3
      - run: dart pub get
        working-directory: core
      - run: dart analyze
        working-directory: core
      - run: dart test
        working-directory: core
      - run: dart pub get
        working-directory: server
      - run: dart analyze
        working-directory: server
      - run: dart test
        working-directory: server

  windows-build:
    runs-on: windows-2022
    defaults:
      run:
        working-directory: app
    steps:
      - uses: actions/checkout@v4
      - uses: subosito/flutter-action@v2
        with:
          flutter-version: 3.29.3
          channel: stable
      - run: choco install openssl -y --no-progress
        working-directory: .
      - run: flutter pub get
      - run: flutter analyze
      - run: flutter test
      - run: flutter build windows --release
      - uses: actions/upload-artifact@v4
        with:
          name: kangoos-windows-x64
          path: app/build/windows/x64/runner/Release/
          if-no-files-found: error

  docker:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - run: docker build -f server/Dockerfile -t kangoos-server:ci .
      - name: Smoke test container
        env:
          KANGOOS_API_TOKEN: 0123456789abcdef0123456789abcdef
        run: |
          docker run -d --name kangoos-server-ci -p 8080:8080 -e KANGOOS_API_TOKEN kangoos-server:ci
          for attempt in {1..20}; do
            if curl --fail --silent --show-error http://127.0.0.1:8080/health \
              && curl --fail --silent --show-error -H "Authorization: Bearer $KANGOOS_API_TOKEN" http://127.0.0.1:8080/snippets; then
              exit 0
            fi
            sleep 1
          done
          docker logs kangoos-server-ci
          exit 1
